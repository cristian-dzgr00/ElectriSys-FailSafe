# ============================================================
# ElectriSys POS — nginx.conf de PRODUCCIÓN (HTTPS)
#
# Igual que nginx/nginx.conf pero sirviendo por TLS con el certificado de
# Let's Encrypt. Las rutas (SPA, /api, /ws, métricas) NO se repiten acá:
# se incluyen desde nginx/locations-electrisys.conf, que es el mismo
# archivo que usa la configuración de desarrollo.
#
# Se activa con el override docker/docker-compose.prod.yml, que monta
# este archivo y /etc/letsencrypt del host.
#
# El dominio se reemplaza en el despliegue (ver docs/despliegue-produccion.md):
#   sed -i 's/electrisys-pos.duckdns.org/TU-SUBDOMINIO.duckdns.org/g' \
#     nginx/nginx.prod.conf
#
# Con esto el WebSocket pasa a wss:// solo: useWebSocket.js deriva el
# esquema de window.location.protocol, no hay nada que tocar en el frontend.
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_comp_level    5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:20m   rate=100r/s;

    # ── VPN subnet (WireGuard: 10.100.0.0/24) ─────────────────
    geo $is_vpn_client {
        default          0;
        10.100.0.0/24    1;
        127.0.0.1        1;
        ::1              1;
    }

    # ── Canary deployment 90/10 (ver nginx.conf) ──────────────
    upstream php_backend {
        server backend-a:9000 weight=9;   # estable
        server backend-b:9000 weight=1;   # canary
    }

    upstream ws_backend {
        server websocket-server:8080;
    }

    # ── HTTP: solo renovación de certificado y redirección ────
    server {
        listen 80;
        server_name electrisys-pos.duckdns.org;

        # certbot en modo webroot escribe el desafío acá. Tiene que seguir
        # siendo accesible por HTTP: Let's Encrypt valida sobre el puerto 80
        # y si esto redirige, la renovación automática falla a los 90 días.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name electrisys-pos.duckdns.org;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/electrisys-pos.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/electrisys-pos.duckdns.org/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "SAMEORIGIN"                      always;
        add_header X-XSS-Protection        "1; mode=block"                   always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        # HSTS solo acá y no en el bloque 80: anunciarlo por HTTP sin
        # certificado válido dejaría el dominio inaccesible si el cert falla.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        include /etc/nginx/locations-electrisys.conf;
    }
}
