# ============================================================
# ElectriSys POS — nginx.conf v3.1
# Cambios vs v2.3:
#   + /stub_status  → métricas para nginx-prometheus-exporter
#   + /ws           → proxy WebSocket (HTTP Upgrade)
#   + /api/usuarios y /api/auditlog → solo IPs VPN (10.100.0.x)
#   + fastcgi_pass apunta a stunnel local (mTLS hacia PHP-FPM)
# Cambios vs v3.0:
#   - fastcgi_param X-Real-IP $remote_addr;  → eliminado (dos ocurrencias).
#     El nombre de parametro no coincide con lo que PHP lee como header
#     (deberia ser HTTP_X_REAL_IP), asi que nunca sobreescribia nada: un
#     atacante podia mandar su propio "X-Real-IP: 10.100.0.5" y evadir la
#     restriccion de VPN. PHP ahora usa unicamente REMOTE_ADDR, que ya
#     llega correctamente vía el "include fastcgi_params;" estandar y no
#     se puede falsificar desde el cliente HTTP.
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_comp_level    5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:20m   rate=100r/s;

    # ── VPN subnet (WireGuard: 10.100.0.0/24) ─────────────────
    geo $is_vpn_client {
        default          0;
        10.100.0.0/24    1;
        127.0.0.1        1;   # desarrollo local IPv4
        ::1              1;   # desarrollo local IPv6
    }

    # ── Canary deployment 90/10 ───────────────────────────────
    # El reparto vive aquí y no en Istio: el VirtualService intentaba
    # dividir tráfico sobre el puerto 9000, que habla FastCGI, y ninguna
    # regla L7 de Istio puede aplicarse a eso (ver k8s/istio/).
    #
    # Antes backend-b estaba como "backup": solo recibía tráfico si
    # backend-a caía, así que nunca se ejercitaba y no había canary real.
    # Con pesos, backend-b sirve ~10% y sigue habiendo failover: nginx
    # marca un upstream como caído tras max_fails y desvía todo al otro.
    upstream php_backend {
        server backend-a:9000 weight=9;   # estable
        server backend-b:9000 weight=1;   # canary
    }

    upstream ws_backend {
        server websocket-server:8080;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "SAMEORIGIN"                      always;
        add_header X-XSS-Protection        "1; mode=block"                   always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ── Métricas Prometheus (solo acceso interno) ──────────
        location /stub_status {
            stub_status on;
            allow 10.0.0.0/8;    # cluster interno
            allow 127.0.0.1;
            deny all;
        }

        # ── WebSocket: /ws → Node.js server ───────────────────
        location /ws {
            proxy_pass         http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;   # mantener WS abierto
            proxy_send_timeout 3600s;
        }

        # ── Rutas de admin: solo VPN ───────────────────────────────
        location ~ ^/api/(usuarios|audit-log) {
            limit_req zone=api_zone burst=20 nodelay;
            include        fastcgi_params;
            fastcgi_pass   php_backend;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param  REQUEST_URI     $request_uri;
        }

        # ── Login con rate limit ───────────────────────────────
        location /api/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;
            include        fastcgi_params;
            fastcgi_pass   php_backend;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        }

        # ── API general ────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            include        fastcgi_params;
            fastcgi_pass   php_backend;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param  REQUEST_URI     $request_uri;
        }

        # ── Frontend React (SPA) ───────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # ── Health check (no rate limit) ───────────────────────
        location = /api/health {
            include      fastcgi_params;
            fastcgi_pass php_backend;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        }

        location ~ /\. {
            deny all;
        }
    }
}