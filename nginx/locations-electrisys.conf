# ============================================================
# ElectriSys POS — locations compartidos entre HTTP y HTTPS
#
# Este archivo se incluye desde el bloque `server` de nginx.conf
# (desarrollo, solo HTTP) y de nginx.prod.conf (producción, TLS). Vive
# aparte para que las dos configuraciones no se vayan separando: una regla
# nueva de /api o del proxy /ws se agrega una sola vez y aplica a ambas.
#
# No incluye `listen`, `server_name`, `root` ni los headers de seguridad:
# eso cambia entre entornos y se define en cada archivo.
# ============================================================

    # ── Métricas Prometheus (solo acceso interno) ──────────
    location /stub_status {
        stub_status on;
        allow 10.0.0.0/8;    # cluster interno
        allow 127.0.0.1;
        deny all;
    }

    # ── WebSocket: /ws → Node.js server ───────────────────
    location /ws {
        proxy_pass         http://ws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;   # mantener WS abierto
        proxy_send_timeout 3600s;
    }

    # ── Rutas de admin: solo VPN ───────────────────────────────
    location ~ ^/api/(usuarios|audit-log) {
        limit_req zone=api_zone burst=20 nodelay;
        include        fastcgi_params;
        fastcgi_pass   php_backend;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  REQUEST_URI     $request_uri;
    }

    # ── Login con rate limit ───────────────────────────────
    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        include        fastcgi_params;
        fastcgi_pass   php_backend;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # ── API general ────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        include        fastcgi_params;
        fastcgi_pass   php_backend;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  REQUEST_URI     $request_uri;
    }

    # ── Assets con hash en el nombre (Vite) ────────────────
    # index-a1b2c3.js cambia de nombre cuando cambia su contenido, así que
    # se pueden cachear para siempre sin riesgo de servir algo viejo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend React (SPA) ───────────────────────────────
    # index.html NO se cachea. Es el único archivo con nombre fijo y es
    # quien apunta a los assets de la versión actual: si el cliente lo
    # guarda, sigue pidiendo los assets viejos aunque el servidor ya tenga
    # los nuevos. Con "expires 1h" un despliegue tardaba hasta una hora en
    # verse, y en la app de escritorio ni siquiera un F5 lo resolvía.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ── Health check (no rate limit) ───────────────────────
    location = /api/health {
        include      fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    location ~ /\. {
        deny all;
    }
