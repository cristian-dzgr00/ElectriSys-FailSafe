groups:
  # ── Red y disponibilidad ──────────────────────────────────────
  - name: network_availability
    rules:
      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx caído"
          description: "El servidor Nginx de ElectriSys lleva {{ $value }}s sin responder."

      # NOTA: aquí había dos alertas basadas en
      # nginx_http_request_duration_seconds_bucket y en
      # nginx_http_requests_total{status=~"5.."}. Ninguna podía dispararse:
      # el nginx-prometheus-exporter leyendo /stub_status NO expone
      # histogramas de latencia ni etiquetas de código de estado (eso
      # requiere NGINX Plus). Parecían cubrir latencia y errores 5xx, pero
      # nunca se evaluaban a nada. Se reemplazan por métricas que
      # stub_status sí publica.

      - alert: NginxConexionesSaturadas
        expr: nginx_connections_active > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nginx con {{ $value }} conexiones activas"
          description: "Saturación sostenida de conexiones; revisar worker_connections (1024 configurados)."

      - alert: NginxConexionesDescartadas
        expr: rate(nginx_connections_accepted[5m]) - rate(nginx_connections_handled[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nginx está descartando conexiones"
          description: "Se aceptaron más conexiones de las que se pudieron atender: se alcanzó un límite de recursos."

  # ── Base de datos ─────────────────────────────────────────────
  - name: database
    rules:
      - alert: MySQLDown
        expr: mysql_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MySQL no disponible ({{ $labels.instance }})"

      - alert: MySQLReplicationLag
        expr: mysql_slave_status_seconds_behind_master > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Replicación MySQL con lag de {{ $value }}s"

      - alert: MySQLTooManyConnections
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL al {{ $value | humanizePercentage }} de conexiones máximas"

  # ── PHP-FPM ───────────────────────────────────────────────────
  - name: php_fpm
    rules:
      - alert: PhpFpmDown
        expr: phpfpm_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PHP-FPM caído ({{ $labels.instance }})"

      - alert: PhpFpmQueueFull
        expr: phpfpm_listen_queue > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Cola de PHP-FPM con {{ $value }} peticiones pendientes"

  # ── Saturación de la aplicación ───────────────────────────────
  - name: saturacion_app
    rules:
      # La alerta anterior (LoginRateLimitTriggered) filtraba por
      # {location="login", status="429"}, etiquetas que stub_status no
      # produce: nunca podía dispararse. Detectar fuerza bruta por
      # métricas exige exportar los 429 desde los logs de nginx
      # (p. ej. con grok_exporter); mientras tanto, esos intentos quedan
      # registrados en la tabla login_attempts y en audit_log.
      - alert: PhpFpmSinProcesosLibres
        expr: phpfpm_max_children_reached > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PHP-FPM agotó su pool de procesos ({{ $labels.instance }})"
          description: "Se alcanzó pm.max_children: las peticiones se encolan y la latencia sube."
