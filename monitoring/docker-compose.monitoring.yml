# ============================================================
# ElectriSys — Stack de Monitoreo (Prometheus + Grafana)
# Uso: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
# ============================================================

services:

  # ── Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: es_prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - electrisys_net

  # ── Grafana ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: es_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?falta en docker/.env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - electrisys_net

  # ── Nginx Prometheus Exporter ─────────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: es_nginx_exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://frontend/stub_status'
    networks:
      - electrisys_net
    depends_on:
      - frontend

  # ── PHP-FPM Exporter — Backend A ──────────────────────────────
  # Lee la página de estado de PHP-FPM por FastCGI (docker/php-fpm-status.conf)
  # y la publica en :9253, que es lo que scrapea Prometheus. Antes Prometheus
  # apuntaba directo a backend-a:9253, donde no escuchaba nada.
  php-fpm-exporter-a:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: es_php_fpm_exporter_a
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://backend-a:9000/status"
      PHP_FPM_WEB_LISTEN_ADDRESS: ":9253"
    networks:
      - electrisys_net
    depends_on:
      - backend-a

  # ── PHP-FPM Exporter — Backend B ──────────────────────────────
  php-fpm-exporter-b:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: es_php_fpm_exporter_b
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://backend-b:9000/status"
      PHP_FPM_WEB_LISTEN_ADDRESS: ":9253"
    networks:
      - electrisys_net
    depends_on:
      - backend-b

  # ── MySQL Exporter — Primary ──────────────────────────────────
  mysql-primary-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: es_mysql_primary_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "root:${MYSQL_ROOT_PASSWORD:?falta en docker/.env}@(mysql-primary:3306)/"
    networks:
      - electrisys_net
    depends_on:
      - mysql-primary

  # ── MySQL Exporter — Replica ──────────────────────────────────
  mysql-replica-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: es_mysql_replica_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "root:${MYSQL_ROOT_PASSWORD:?falta en docker/.env}@(mysql-replica:3306)/"
    networks:
      - electrisys_net
    depends_on:
      - mysql-replica

  # ── Node Exporter ─────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: es_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - electrisys_net

  # ── Alertmanager ──────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: es_alertmanager
    restart: unless-stopped
    volumes:
      - alertmanager_data:/alertmanager
    networks:
      - electrisys_net

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
