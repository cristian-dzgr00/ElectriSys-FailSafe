global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: electrisys
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # ── Prometheus en sí mismo ────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Nginx (nginx-prometheus-exporter) ─────────────────────────
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'electrisys-nginx'

  # ── PHP-FPM (php-fpm_exporter) ────────────────────────────────
  # Apuntan al contenedor exporter, no al backend: en backend-a/b solo
  # escuchan 9000 (FastCGI) y 9443 (stunnel), nunca hubo nada en 9253.
  - job_name: php-fpm-a
    static_configs:
      - targets: ['php-fpm-exporter-a:9253']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend-a'

  - job_name: php-fpm-b
    static_configs:
      - targets: ['php-fpm-exporter-b:9253']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend-b'

  # ── MySQL Primary (mysqld_exporter) ───────────────────────────
  - job_name: mysql-primary
    static_configs:
      - targets: ['mysql-primary-exporter:9104']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mysql-primary'

  # ── MySQL Replica ──────────────────────────────────────────────
  - job_name: mysql-replica
    static_configs:
      - targets: ['mysql-replica-exporter:9104']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mysql-replica'

  # ── Backend health ────────────────────────────────────────────
  # Se eliminó el job que apuntaba a backend-a:80 y backend-b:80 con
  # metrics_path /api/health/metrics. No podía funcionar: en esos
  # contenedores no escucha nada en el puerto 80 (PHP-FPM usa 9000 por
  # FastCGI), esa ruta no existe en la aplicación, y /api/health responde
  # JSON, que Prometheus no sabe parsear.
  #
  # La disponibilidad del backend queda cubierta por los jobs php-fpm-a y
  # php-fpm-b de arriba (el propio "up" del exporter indica si PHP-FPM
  # responde). Para sondear el endpoint HTTP /api/health como tal haría
  # falta agregar blackbox_exporter y apuntarlo al contenedor frontend,
  # que es quien lo sirve vía nginx.

  # ── Node exporter (métricas de host) ──────────────────────────
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
