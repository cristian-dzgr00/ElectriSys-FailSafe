# ============================================================
# ElectriSys POS — GitHub Actions CI/CD Pipeline
# Flujo: lint → test → build → push → deploy
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND:  ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint + Test Frontend
  # ─────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Run unit tests (Vitest)
        run: npm run test --if-present

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://api.electrisys.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Test Backend PHP
  # ─────────────────────────────────────────
  test-backend:
    name: Test Backend PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Sin servicio de base de datos: la suite de PHPUnit (HealthTest,
    # GestorAsistenteTest) no toca Oracle. Antes este job levantaba MySQL 8
    # y cargaba database/schema.sql — el esquema del diseño descartado, que
    # ya no se despliega. Probar contra un motor que la aplicación no usa no
    # demostraba nada y sumaba dos minutos a cada push.
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --optimize-autoloader

      - name: Lint de sintaxis (php -l) sobre todo src/
        run: find src public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-text
        env:
          JWT_SECRET: test_secret_key_for_ci
          JWT_EXPIRATION: 3600
          APP_ENV: testing

  # ─────────────────────────────────────────
  # JOB 2b: Test microservicio NLP (Python)
  # ─────────────────────────────────────────
  # Los modelos propios (intención, NER, recomendador, predicción de
  # demanda) tienen su propia suite y hasta ahora no corría en CI: un
  # cambio en el recomendador podía romper la vista de repuestos sin que
  # ningún check lo marcara.
  test-nlp:
    name: Test NLP Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nlp-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest tests -q

  # ─────────────────────────────────────────
  # JOB 3: Build & Push Docker Images
  # ─────────────────────────────────────────
  build-push:
    name: Build & Push Images
    needs: [test-frontend, test-backend, test-nlp]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_BACKEND }}
            ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/Dockerfile.backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./docker/Dockerfile.frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 4: Deploy a Kubernetes
  # ─────────────────────────────────────────
  # El despliegue de producción de este proyecto es Docker Compose sobre un
  # Droplet (ver docs/despliegue-produccion.md), no Kubernetes. Este job se
  # conserva para el entorno de k8s del curso y solo corre si existe el
  # secret KUBE_CONFIG — sin el, se salta en vez de fallar el pipeline.
  deploy:
    name: Deploy to K8s
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_K8S == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Update image tags in manifests
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/frontend-deployment.yaml

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/electrisys-backend  -n electrisys --timeout=5m
          kubectl rollout status deployment/electrisys-frontend -n electrisys --timeout=5m

      - name: Verify health endpoint
        run: |
          sleep 15
          kubectl run health-check --image=curlimages/curl --restart=Never --rm -i \
            -- curl -sf http://electrisys-backend-service/api/health || exit 1
