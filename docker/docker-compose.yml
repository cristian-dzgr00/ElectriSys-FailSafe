# ============================================================
# ElectriSys POS - Docker Compose v3.0 (desarrollo local)
# Cambios vs v2:
#   + websocket-server (Node.js)
#   + stunnel en backend-a y backend-b (mTLS hacia PHP-FPM)
#   + redes separadas: electrisys_net, monitoring_net
#   + usar con: docker compose -f docker-compose.yml
#              -f ../monitoring/docker-compose.monitoring.yml up
# ============================================================

services:

  # ── MySQL Primary ─────────────────────────────────────────
  mysql-primary:
    image: mysql:8.0
    container_name: es_mysql_primary
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass2024
      MYSQL_DATABASE:      electrisys
      MYSQL_USER:          electrisys_user
      MYSQL_PASSWORD:      ElectriPass2024!
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-do-db=electrisys
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ../database/replication.sql:/docker-entrypoint-initdb.d/03-replication.sql
      - ../database/schema_v3_migration_nlp.sql:/docker-entrypoint-initdb.d/04-schema-v3-nlp.sql
      - ../database/seed_vehiculos.sql:/docker-entrypoint-initdb.d/05-seed-vehiculos.sql
      - ../tls/mysql/mysql-ssl.cnf:/etc/mysql/conf.d/ssl.cnf:ro
      - ../tls/ca:/etc/mysql/tls:ro
    ports:
      - "3306:3306"
    networks:
      - electrisys_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass2024"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL Replica ─────────────────────────────────────────
  mysql-replica:
    image: mysql:8.0
    container_name: es_mysql_replica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass2024
      MYSQL_DATABASE:      electrisys
      MYSQL_USER:          electrisys_user
      MYSQL_PASSWORD:      ElectriPass2024!
    command: >
      --server-id=2
      --relay-log=relay-bin
      --read-only=1
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ../tls/ca:/etc/mysql/tls:ro
    ports:
      - "3307:3306"
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - electrisys_net

  # ── Backend PHP - Instancia A ─────────────────────────────
  backend-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: es_backend_a
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DB_PRIMARY_HOST: mysql-primary
      DB_REPLICA_HOST: mysql-replica
      WS_NOTIFY_KEY:   ws_internal_notify_key
    volumes:
      - ../backend:/var/www/html
      - ../tls:/etc/tls:ro
      - ../tls/stunnel/fpm-listener.conf:/etc/stunnel/stunnel.conf:ro
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - electrisys_net

  # ── Backend PHP - Instancia B (failover) ──────────────────
  backend-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: es_backend_b
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DB_PRIMARY_HOST: mysql-primary
      DB_REPLICA_HOST: mysql-replica
      WS_NOTIFY_KEY:   ws_internal_notify_key
    volumes:
      - ../backend:/var/www/html
      - ../tls:/etc/tls:ro
      - ../tls/stunnel/fpm-listener.conf:/etc/stunnel/stunnel.conf:ro
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - electrisys_net

  # ── WebSocket Server (Node.js) ────────────────────────────
  websocket-server:
    build:
      context: ../websocket-server
      dockerfile: Dockerfile
    container_name: es_websocket
    restart: unless-stopped
    environment:
      WS_PORT:       "8080"
      JWT_SECRET:    "${JWT_SECRET:-electrisys_jwt_secret_2024_super_seguro}"
      WS_NOTIFY_KEY: ws_internal_notify_key
    ports:
      - "8080:8080"
    networks:
      - electrisys_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Microservicio NLP (asistente de recomendación de repuestos) ──
  nlp-service:
    build:
      context: ../nlp-service
      dockerfile: Dockerfile
    container_name: es_nlp_service
    restart: unless-stopped
    environment:
      # El backend PHP no habla HTTP directo (php-fpm detrás de stunnel) —
      # se llega a él vía el contenedor "frontend" (nginx), igual que un
      # navegador externo. Ver nginx/nginx.conf: proxya /api/ a php_backend.
      BACKEND_URL:      "http://frontend"
      JWT_SECRET:       "${JWT_SECRET:-electrisys_jwt_secret_2024_super_seguro}"
      NLP_INTERNAL_KEY: nlp_internal_key_2024
    networks:
      - electrisys_net
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend + NGINX ──────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: es_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../tls/stunnel/nginx-to-fpm.conf:/etc/stunnel/stunnel.conf:ro
      - ../tls:/etc/tls:ro
    depends_on:
      - backend-a
      - backend-b
      - websocket-server
    networks:
      - electrisys_net

volumes:
  mysql_primary_data:
  mysql_replica_data:

networks:
  electrisys_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
