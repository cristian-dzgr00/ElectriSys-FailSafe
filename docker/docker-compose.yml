# ============================================================
# ElectriSys POS - Docker Compose v3.0 (desarrollo local)
# Cambios vs v2:
#   + websocket-server (Node.js)
#   + stunnel en backend-a y backend-b (mTLS hacia PHP-FPM)
#   + redes separadas: electrisys_net, monitoring_net
#   + usar con: docker compose -f docker-compose.yml
#              -f ../monitoring/docker-compose.monitoring.yml up
# ============================================================

services:

  # ── Oracle Database 23ai Free — motor único del proyecto ──
  # Reemplazó a MySQL primary+réplica: Oracle 23ai Free no soporta Data
  # Guard/RAC (features Enterprise), así que la topología es de una sola
  # instancia. Ver oracle/docs/migracion-oracle.md.
  # Los scripts de oracle/ se montan en /scripts pero NO se auto-ejecutan:
  # hay que correr `docker compose exec oracle-db sh /scripts/cargar_esquema.sh`
  # una vez tras el primer arranque. El encabezado de ese script explica por
  # qué el orden y el usuario de cada .sql importan demasiado como para
  # dejárselo a /container-entrypoint-initdb.d.
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: es_oracle_db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: "${ORACLE_PASSWORD:?falta en docker/.env}"
      APP_USER:          electrisys
      APP_USER_PASSWORD: "${DB_PASS:?falta en docker/.env}"
    ports:
      # 1522 en el host: el 1521 ya lo usa una instancia Oracle nativa
      # existente en esta máquina (la del ejercicio académico oracle/).
      # Los demás contenedores igual se conectan por el puerto interno
      # 1521 vía el nombre de servicio "oracle-db".
      - "1522:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ../oracle:/scripts:ro
    networks:
      - electrisys_net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Backend PHP - Instancia A ─────────────────────────────
  backend-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: es_backend_a
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DB_HOST: oracle-db
      DB_PORT: "1521"
      DB_SERVICE_NAME: FREEPDB1
      DB_USER: electrisys
      DB_PASS: "${DB_PASS:?falta en docker/.env}"
      # Estas tres pisan lo que traiga backend/.env: docker/.env es el
      # único origen de verdad, para que backend, websocket y nlp compartan
      # exactamente el mismo valor (si divergen, los JWT no validan).
      JWT_SECRET:       "${JWT_SECRET:?falta en docker/.env — copiá docker/.env.example}"
      WS_NOTIFY_KEY:    "${WS_NOTIFY_KEY:?falta en docker/.env — copiá docker/.env.example}"
      NLP_INTERNAL_KEY: "${NLP_INTERNAL_KEY:?falta en docker/.env — copiá docker/.env.example}"
    volumes:
      - ../backend:/var/www/html
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - electrisys_net

  # ── Backend PHP - Instancia B (failover) ──────────────────
  backend-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: es_backend_b
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DB_HOST: oracle-db
      DB_PORT: "1521"
      DB_SERVICE_NAME: FREEPDB1
      DB_USER: electrisys
      DB_PASS: "${DB_PASS:?falta en docker/.env}"
      # Estas tres pisan lo que traiga backend/.env: docker/.env es el
      # único origen de verdad, para que backend, websocket y nlp compartan
      # exactamente el mismo valor (si divergen, los JWT no validan).
      JWT_SECRET:       "${JWT_SECRET:?falta en docker/.env — copiá docker/.env.example}"
      WS_NOTIFY_KEY:    "${WS_NOTIFY_KEY:?falta en docker/.env — copiá docker/.env.example}"
      NLP_INTERNAL_KEY: "${NLP_INTERNAL_KEY:?falta en docker/.env — copiá docker/.env.example}"
    volumes:
      - ../backend:/var/www/html
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - electrisys_net

  # ── WebSocket Server (Node.js) ────────────────────────────
  websocket-server:
    build:
      context: ../websocket-server
      dockerfile: Dockerfile
    container_name: es_websocket
    restart: unless-stopped
    environment:
      WS_PORT:       "8080"
      JWT_SECRET:    "${JWT_SECRET:?falta en docker/.env — copiá docker/.env.example}"
      WS_NOTIFY_KEY: "${WS_NOTIFY_KEY:?falta en docker/.env — copiá docker/.env.example}"
    ports:
      - "8080:8080"
    networks:
      - electrisys_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Microservicio NLP (asistente de recomendación de repuestos) ──
  nlp-service:
    build:
      context: ../nlp-service
      dockerfile: Dockerfile
    container_name: es_nlp_service
    restart: unless-stopped
    environment:
      # El backend PHP no habla HTTP directo (php-fpm detrás de stunnel) —
      # se llega a él vía el contenedor "frontend" (nginx), igual que un
      # navegador externo. Ver nginx/nginx.conf: proxya /api/ a php_backend.
      BACKEND_URL:      "http://frontend"
      JWT_SECRET:       "${JWT_SECRET:?falta en docker/.env — copiá docker/.env.example}"
      NLP_INTERNAL_KEY: "${NLP_INTERNAL_KEY:?falta en docker/.env — copiá docker/.env.example}"
    volumes:
      # Tabla de posibles errores del NER (la mantiene app/ner/agente_errores.py).
      # Solo data/errores/ y no data/ entera: un volumen sobre data/ taparía el
      # intents_dataset.csv de cada imagen nueva. La primera vez Docker copia
      # la tabla de la imagen al volumen; aunque se borrara, las filas "auto"
      # se regeneran solas al arrancar (el generador es determinista).
      - nlp_errores:/app/data/errores
    networks:
      - electrisys_net
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend + NGINX ──────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: es_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Rutas compartidas con la config de producción (nginx.prod.conf);
      # nginx.conf las incluye, así que este montaje no es opcional.
      - ../nginx/locations-electrisys.conf:/etc/nginx/locations-electrisys.conf:ro
      - ../tls/stunnel/nginx-to-fpm.conf:/etc/stunnel/stunnel.conf:ro
      - ../tls:/etc/tls:ro
    depends_on:
      - backend-a
      - backend-b
      - websocket-server
    networks:
      - electrisys_net

volumes:
  oracle_data:
  nlp_errores:

networks:
  electrisys_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
