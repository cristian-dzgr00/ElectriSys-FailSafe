; ============================================================
; Habilita la página de estado de PHP-FPM.
;
; php-fpm_exporter la consulta por FastCGI (tcp://backend:9000/status)
; para publicar las métricas que Prometheus scrapea. Sin esto, el
; exporter no tiene de dónde leer y los jobs php-fpm-a/php-fpm-b
; quedaban permanentemente en "down".
;
; No se expone por HTTP: nginx no proxya /status, así que solo es
; alcanzable por FastCGI desde dentro de la red de Docker.
; ============================================================
[www]
pm.status_path = /status
ping.path = /ping
