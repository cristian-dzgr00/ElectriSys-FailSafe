# ============================================================
# /etc/wireguard/wg0.conf — ElectriSys VPN Server
#
# Protege las rutas de administración:
#   /api/usuarios   → solo accesible desde 10.100.0.0/24
#   /api/auditlog   → solo accesible desde 10.100.0.0/24
#
# Generar claves:
#   wg genkey | tee server_private.key | wg pubkey > server_public.key
#   wg genkey | tee client1_private.key | wg pubkey > client1_public.key
# ============================================================

[Interface]
Address    = 10.100.0.1/24
ListenPort = 51820
PrivateKey = <SERVER_PRIVATE_KEY>       # reemplazar con server_private.key

# Habilitar IP forwarding para enrutar tráfico al cluster
PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# ── Peer: Administrador 1 ─────────────────────────────────────
[Peer]
PublicKey  = <CLIENT1_PUBLIC_KEY>       # reemplazar con client1_public.key
AllowedIPs = 10.100.0.2/32
PersistentKeepalive = 25

