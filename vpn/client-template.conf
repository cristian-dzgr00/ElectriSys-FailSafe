# ============================================================
# client-template.conf — plantilla para cada administrador
# Copiar, rellenar las claves y entregar por canal seguro.
# ============================================================

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>      # clave privada del cliente
Address    = 10.100.0.X/32            # asignar IP única: .2, .3, etc.
DNS        = 1.1.1.1

[Peer]
PublicKey           = <SERVER_PUBLIC_KEY>
Endpoint            = <SERVER_IP>:51820
# Solo el tráfico al cluster va por VPN (split tunneling)
AllowedIPs          = 10.100.0.0/24, <CLUSTER_SUBNET>/24
PersistentKeepalive = 25
