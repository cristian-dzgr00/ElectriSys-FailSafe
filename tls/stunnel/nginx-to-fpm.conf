; ============================================================
; stunnel/nginx-to-fpm.conf
; Lado CLIENTE: Nginx conecta a este puerto local (9001)
; y stunnel envuelve la conexión en TLS hacia PHP-FPM.
; ============================================================
[php-fpm-tls-client]
client      = yes
accept      = 127.0.0.1:9001          ; Nginx conecta aquí
connect     = backend-a:9443           ; PHP-FPM TLS listener

; Certificado del cliente (Nginx se autentica ante PHP-FPM)
cert        = /etc/tls/nginx/nginx.crt
key         = /etc/tls/nginx/nginx.key

; Verificar que el servidor es realmente PHP-FPM de ElectriSys
CAfile      = /etc/tls/ca/ca.crt
verify      = 2                        ; verifica CA + nombre

sslVersion  = TLSv1.3
ciphers     = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
