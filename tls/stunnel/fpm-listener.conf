; ============================================================
; stunnel/fpm-listener.conf
; Lado SERVIDOR: PHP-FPM escucha en 9443 con TLS.
; stunnel desenvuelve el TLS y entrega a PHP-FPM en 9000.
; ============================================================
[php-fpm-tls-server]
client      = no
accept      = 0.0.0.0:9443            ; escucha TLS externo
connect     = 127.0.0.1:9000          ; PHP-FPM local en texto plano

; Certificado del servidor (PHP-FPM se identifica ante Nginx)
cert        = /etc/tls/php-fpm/php-fpm.crt
key         = /etc/tls/php-fpm/php-fpm.key

; Verificar que el cliente (Nginx) también tiene un cert válido
CAfile      = /etc/tls/ca/ca.crt
verify      = 2                        ; mTLS: AMBOS se autentican

sslVersion  = TLSv1.3
ciphers     = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
