# ============================================================
# NetworkPolicy: allow-mysql-egress
#
# La réplica es quien ABRE la conexión hacia la primaria para leer el
# binlog (ver database/setup-replica.sh). Con deny-all y sin egress,
# allow-backend-to-mysql-replica permitía la entrada desde mysql-primary
# pero la réplica nunca podía salir, así que la replicación no arrancaba.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-replica-egress
  namespace: electrisys
spec:
  podSelector:
    matchLabels:
      app: mysql-replica
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mysql-primary
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-primary-egress
  namespace: electrisys
spec:
  podSelector:
    matchLabels:
      app: mysql-primary
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
