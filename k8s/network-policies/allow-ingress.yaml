# ============================================================
# NetworkPolicy: allow-ingress
# Permite tráfico HTTP externo (puerto 80) al pod frontend
# y acceso al DNS del cluster (kube-dns).
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-ingress
  namespace: electrisys
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
  egress:
    # Permitir salida al backend
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 9000
    # Proxy /ws -> websocket-server (ver location /ws en nginx.conf)
    - to:
        - podSelector:
            matchLabels:
              app: websocket-server
      ports:
        - protocol: TCP
          port: 8080
    # Permitir DNS (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
