# ============================================================
# ElectriSys POS — Emissary-Ingress (Ambassador) API Gateway
# ============================================================
#
# PREREQUISITOS — ejecutar UNA SOLA VEZ antes de aplicar este archivo:
#
#   kubectl apply -f https://app.getambassador.io/yaml/emissary/3.9.1/emissary-crds.yaml
#   kubectl wait --timeout=90s --for=condition=available deployment emissary-apiext -n emissary-system
#   kubectl apply -f https://app.getambassador.io/yaml/emissary/3.9.1/emissary-emissaryns.yaml
#   kubectl wait --timeout=90s --for=condition=available deployment emissary-ingress -n emissary
#
# APLICAR este archivo:
#   kubectl apply -f ambassador-mapping.yaml
# ============================================================

# ── 1. Listener HTTP (puerto 8080 expuesto por el LoadBalancer) ───
apiVersion: getambassador.io/v3alpha1
kind: Listener
metadata:
  name: electrisys-http-listener
  namespace: emissary
spec:
  port: 8080
  protocol: HTTPS
  securityModel: XFP
  hostBinding:
    namespace:
      from: ALL
---
# ── 2. Host — acepta cualquier hostname (desarrollo local) ────────
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: electrisys-host
  namespace: emissary
spec:
  hostname: "*"
  requestPolicy:
    insecure:
      action: Route          # HTTP permitido en dev (sin TLS)
---
# ── 3. Mapping: /api/auth/login — rate limit estricto ────────────
#    Máx 10 intentos/min por IP (protección brute-force)
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: electrisys-auth-login
  namespace: emissary
spec:
  hostname: "*"
  prefix: /api/auth/login
  service: frontend.electrisys:80      # NGINX → PHP-FPM backend-a/b
  timeout_ms: 10000
  retry_policy:
    retry_on: "5xx"
    num_retries: 1
  labels:
    ambassador:
      - string_request_label:
          label: remote_address       # clave para rate limit por IP
  cors:
    origins: "*"
    methods: POST, OPTIONS
    headers: Authorization, Content-Type
    credentials: true
---
# ── 4. Mapping: /api/ — rutas protegidas con JWT ─────────────────
#    Incluye header X-ElectriSys-GW para trazabilidad en PHP
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: electrisys-api
  namespace: emissary
spec:
  hostname: "*"
  prefix: /api/
  service: frontend.electrisys:80
  timeout_ms: 30000
  retry_policy:
    retry_on: "5xx connect-failure reset"
    num_retries: 2
  add_request_headers:
    X-ElectriSys-GW:
      value: "ambassador-v1"
    X-Forwarded-Proto:
      value: "http"
  cors:
    origins: "*"
    methods: GET, POST, PUT, DELETE, OPTIONS
    headers: Authorization, Content-Type
    credentials: true
  circuit_breakers:
    - priority: default
      max_connections: 200
      max_pending_requests: 100
      max_requests: 300
      max_retries: 5
---
# ── 5. Mapping: / — frontend React SPA ───────────────────────────
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: electrisys-frontend
  namespace: emissary
spec:
  hostname: "*"
  prefix: /
  service: frontend.electrisys:80
  timeout_ms: 10000
---
# ── 6. RateLimitService — usa Redis de Emissary ──────────────────
apiVersion: getambassador.io/v3alpha1
kind: RateLimitService
metadata:
  name: electrisys-ratelimit
  namespace: emissary
spec:
  service: "emissary-redis.emissary:6379"
  protocol_version: v3
---
# ── 7. Module global — configuración del gateway ─────────────────
apiVersion: getambassador.io/v3alpha1
kind: Module
metadata:
  name: ambassador
  namespace: emissary
spec:
  config:
    # Cabecera de tracking por request (visible en logs PHP)
    add_linkerd_headers: false
    # Tiempo máximo global
    cluster_idle_timeout_ms: 30000
    # Propagar IP real del cliente al backend
    use_remote_address: true
    # Tamaño máximo del body (10 MB para evitar abuse)
    buffer:
      max_request_bytes: 10485760
    # Logs de acceso en stdout para kubectl logs
    envoy_log_type: text
    envoy_log_format: >
      [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%
      %PROTOCOL%" %RESPONSE_CODE% %BYTES_SENT% "%REQ(USER-AGENT)%"
      "%REQ(X-FORWARDED-FOR)%" duration=%DURATION%ms
---
# ── 8. LoadBalancer Service — expone Emissary al exterior ─────────
#    En Docker Desktop / minikube: EXTERNAL-IP = localhost o 127.0.0.1
apiVersion: v1
kind: Service
metadata:
  name: electrisys-gateway
  namespace: emissary
  labels:
    app: electrisys-gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: emissary-ingress
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: admin
      port: 8877
      targetPort: 8877