# ============================================================
# VirtualService — enrutamiento y canary deployment
# Distribuye tráfico: 90% backend-a / 10% backend-b (canary).
# Cambia los pesos para promover la versión nueva.
# ============================================================
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: electrisys-backend
  namespace: electrisys
spec:
  hosts:
    - backend
  gateways:
    - electrisys-gateway
    - mesh              # tráfico interno entre pods
  http:
    # ── Rutas de autenticación (sin canary, siempre al primario) ──
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: backend-a
            port:
              number: 9000
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s

    # ── Resto de la API (canary 90/10) ────────────────────────────
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: backend-a
            port:
              number: 9000
            subset: stable
          weight: 90
        - destination:
            host: backend-b
            port:
              number: 9000
            subset: canary
          weight: 10
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: "5xx,reset,connect-failure,retriable-4xx"
