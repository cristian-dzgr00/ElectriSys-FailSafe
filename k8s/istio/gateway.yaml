# ============================================================
# Istio Gateway — punto de entrada al cluster
# Reemplaza ambassador-mapping.yaml
# ============================================================
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: electrisys-gateway
  namespace: electrisys
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: electrisys-tls-cert
      hosts:
        - "electrisys.com"
        - "api.electrisys.com"
