# ============================================================
# ElectriSys - MySQL Replica (fallback de escritura)
# ============================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-replica-pvc
  namespace: electrisys
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-replica-config
  namespace: electrisys
data:
  my.cnf: |
    [mysqld]
    server-id       = 2
    relay-log       = relay-bin
    read-only       = 1
    max_connections = 200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-replica
  namespace: electrisys
  labels:
    app: mysql-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-replica
  template:
    metadata:
      labels:
        app: mysql-replica
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: electrisys-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: electrisys
            - name: MYSQL_USER
              value: electrisys_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: electrisys-secrets
                  key: MYSQL_PASSWORD
            # Credenciales que usa setup-replica.sh para engancharse al
            # primary. Sin este script la réplica arrancaba en read-only
            # pero nunca ejecutaba CHANGE REPLICATION SOURCE TO, así que
            # jamás replicaba nada.
            - name: REPLICATION_SOURCE_HOST
              value: mysql-primary
            - name: REPLICATION_USER
              value: replicator
            - name: REPLICATION_PASSWORD
              value: "ReplicaPass2024!"
          volumeMounts:
            - name: mysql-replica-storage
              mountPath: /var/lib/mysql
            - name: mysql-replica-config
              mountPath: /etc/mysql/conf.d
            - name: mysql-replica-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              # Contraseña desde el Secret, no incrustada (ver mysql-primary.yaml).
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          # Readiness que además comprueba que la replicación esté corriendo:
          # así un pod cuya réplica se detuvo sale del Service en vez de
          # seguir sirviendo lecturas desactualizadas.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e 'SHOW REPLICA STATUS\G' | grep -q 'Replica_IO_Running: Yes'
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: mysql-replica-storage
          persistentVolumeClaim:
            claimName: mysql-replica-pvc
        - name: mysql-replica-config
          configMap:
            name: mysql-replica-config
        - name: mysql-replica-init
          configMap:
            name: mysql-replica-init
            # Ejecutable: la imagen de MySQL corre los .sh de initdb.d como
            # subproceso si tienen permiso de ejecución (si no, los "sourcea",
            # y el `set -euo pipefail` del script afectaría al entrypoint).
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  namespace: electrisys
spec:
  selector:
    app: mysql-replica
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
