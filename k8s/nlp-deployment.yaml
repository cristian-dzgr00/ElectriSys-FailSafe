# ============================================================
# ElectriSys - Microservicio de NLP (asistente de recomendación)
# Sin este Deployment, /api/asistente/consultar responde 503 en el
# clúster: no existía ningún workload para nlp-service (docker-compose.yml
# sí lo levanta, pero los manifiestos de k8s nunca lo incluyeron).
# ============================================================

# ── Tabla de posibles errores del NER ─────────────────────
# La mantiene app/ner/agente_errores.py (marcas/modelos nuevos se agregan
# en caliente). Equivale al volumen nlp_errores de docker-compose.yml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nlp-errores-pvc
  namespace: electrisys
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-service
  namespace: electrisys
  labels:
    app: nlp-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nlp-service
  template:
    metadata:
      labels:
        app: nlp-service
    spec:
      # A diferencia de un volumen de Docker, un PVC nuevo arranca vacío:
      # se copia la tabla que trae la imagen solo si todavía no existe
      # (cp -n), para no pisar lo que el agente agregó en ejecución.
      initContainers:
        - name: sembrar-tabla-errores
          image: electrisys/nlp-service:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -n /app/data/errores/* /semilla/ || true"]
          volumeMounts:
            - name: tabla-errores
              mountPath: /semilla
      containers:
        - name: nlp-service
          image: electrisys/nlp-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # El backend PHP no habla HTTP directo (php-fpm detrás de
            # stunnel) — se llega a él vía el Service "frontend" (nginx),
            # igual que en docker-compose.yml. Ver nginx/nginx.conf.
            - name: BACKEND_URL
              value: "http://frontend"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: electrisys-secrets
                  key: JWT_SECRET
            - name: NLP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: electrisys-secrets
                  key: NLP_INTERNAL_KEY
          volumeMounts:
            - name: tabla-errores
              mountPath: /app/data/errores
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tabla-errores
          persistentVolumeClaim:
            claimName: nlp-errores-pvc
