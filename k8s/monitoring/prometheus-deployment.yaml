apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: electrisys
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: nginx
        static_configs:
          - targets: ['nginx-exporter:9113']
      - job_name: php-fpm-a
        static_configs:
          - targets: ['backend-a:9253']
      - job_name: php-fpm-b
        static_configs:
          - targets: ['backend-b:9253']
      - job_name: mysql-primary
        static_configs:
          - targets: ['mysql-primary-exporter:9104']
      - job_name: mysql-replica
        static_configs:
          - targets: ['mysql-replica-exporter:9104']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: electrisys
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.retention.time=15d'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: electrisys
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
