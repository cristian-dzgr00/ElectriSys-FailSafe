# ============================================================
# ElectriSys — Secrets v3.0
# Cambios vs v2:
#   + WS_NOTIFY_KEY  → clave interna backend → WebSocket server
#   + GRAFANA_PASSWORD → contraseña admin de Grafana
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: electrisys-secrets
  namespace: electrisys
  annotations:
    electrisys.io/sealed-secret-required: "true"
type: Opaque
stringData:
  # ── Base de datos ─────────────────────────────────────────────
  DB_PRIMARY_HOST: "mysql-primary"
  DB_PRIMARY_PORT: "3306"
  DB_NAME:         "electrisys"
  DB_USER:         "electrisys_user"
  DB_PASS:         "CAMBIAR_EN_PRODUCCION"

  DB_REPLICA_HOST: "mysql-replica"
  DB_REPLICA_PORT: "3306"

  # ── JWT ───────────────────────────────────────────────────────
  JWT_SECRET:     "CAMBIAR_EN_PRODUCCION_openssl_rand_base64_64"
  JWT_EXPIRATION: "28800"

  # ── Aplicación ────────────────────────────────────────────────
  APP_ENV:      "production"
  FRONTEND_URL: "https://tu-dominio.com"

  # ── MySQL ─────────────────────────────────────────────────────
  MYSQL_ROOT_PASSWORD: "CAMBIAR_EN_PRODUCCION"
  MYSQL_PASSWORD:      "CAMBIAR_EN_PRODUCCION"

  # ── WebSocket Server ──────────────────────────────────────────
  # Clave interna: PHP → WS server para /notify
  # Generar con: openssl rand -hex 32
  WS_NOTIFY_KEY: "CAMBIAR_EN_PRODUCCION_openssl_rand_hex_32"

  # ── Grafana ───────────────────────────────────────────────────
  GRAFANA_PASSWORD: "CAMBIAR_EN_PRODUCCION"
