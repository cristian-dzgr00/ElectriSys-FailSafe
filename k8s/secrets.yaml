# ============================================================
# ElectriSys — Secrets v3.1
# Cambios vs v2:
#   + WS_NOTIFY_KEY  → clave interna backend → WebSocket server
#   + GRAFANA_PASSWORD → contraseña admin de Grafana
# Cambios vs v3.0:
#   + NLP_INTERNAL_KEY → clave interna backend → nlp-service (faltaba;
#     sin ella backend-deployment.yaml no podía autenticarse contra
#     nlp-deployment.yaml, el manifiesto del microservicio de NLP que
#     antes no existía en k8s).
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: electrisys-secrets
  namespace: electrisys
  annotations:
    electrisys.io/sealed-secret-required: "true"
type: Opaque
stringData:
  # ── Base de datos ─────────────────────────────────────────────
  # Los nombres DEBEN ser los que lee backend/src/models/Database.php:
  # DB_PRIMARY_* y DB_REPLICA_*. Antes solo estaban DB_NAME/DB_USER/DB_PASS,
  # así que Database.php no los encontraba y caía a sus valores por defecto
  # — con contraseña VACÍA — y el backend no podía conectar a MySQL.
  DB_PRIMARY_HOST: "mysql-primary"
  DB_PRIMARY_PORT: "3306"
  DB_PRIMARY_NAME: "electrisys"
  DB_PRIMARY_USER: "electrisys_user"
  DB_PRIMARY_PASS: "CAMBIAR_EN_PRODUCCION"

  DB_REPLICA_HOST: "mysql-replica"
  DB_REPLICA_PORT: "3306"
  DB_REPLICA_NAME: "electrisys"
  DB_REPLICA_USER: "electrisys_user"
  DB_REPLICA_PASS: "CAMBIAR_EN_PRODUCCION"

  # ── JWT ───────────────────────────────────────────────────────
  JWT_SECRET:     "CAMBIAR_EN_PRODUCCION_openssl_rand_base64_64"
  JWT_EXPIRATION: "28800"

  # ── Aplicación ────────────────────────────────────────────────
  APP_ENV:      "production"
  FRONTEND_URL: "https://tu-dominio.com"

  # ── MySQL ─────────────────────────────────────────────────────
  MYSQL_ROOT_PASSWORD: "CAMBIAR_EN_PRODUCCION"
  MYSQL_PASSWORD:      "CAMBIAR_EN_PRODUCCION"

  # ── WebSocket Server ──────────────────────────────────────────
  # Clave interna: PHP → WS server para /notify
  # Generar con: openssl rand -hex 32
  WS_NOTIFY_KEY: "CAMBIAR_EN_PRODUCCION_openssl_rand_hex_32"

  # ── Microservicio NLP ─────────────────────────────────────────
  # Clave interna: PHP → nlp-service para /nlp/consultar (X-Internal-Key)
  # Generar con: openssl rand -hex 32
  NLP_INTERNAL_KEY: "CAMBIAR_EN_PRODUCCION_openssl_rand_hex_32"

  # ── Grafana ───────────────────────────────────────────────────
  GRAFANA_PASSWORD: "CAMBIAR_EN_PRODUCCION"
