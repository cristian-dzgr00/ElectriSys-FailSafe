# ============================================================
# External Secrets Operator — plantilla para AWS Secrets Manager
# Requiere: helm install external-secrets external-secrets/external-secrets
# ============================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: electrisys
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: electrisys-external-secret
  namespace: electrisys
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: electrisys-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASS
      remoteRef:
        key: electrisys/production
        property: db_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: electrisys/production
        property: jwt_secret
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: electrisys/production
        property: mysql_root_password
