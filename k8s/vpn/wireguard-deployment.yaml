apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: electrisys
  labels:
    app: wireguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
        - name: wireguard
          image: linuxserver/wireguard:latest
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Bogota"
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "2"           # número de clientes a generar
            - name: PEERDNS
              value: "auto"
            - name: INTERNAL_SUBNET
              value: "10.100.0.0"
          ports:
            - containerPort: 51820
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: modules
              mountPath: /lib/modules
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: config
          emptyDir: {}
        - name: modules
          hostPath:
            path: /lib/modules
