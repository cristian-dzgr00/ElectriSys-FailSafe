# ============================================================
# ElectriSys - Backend PHP Deployments (A y B)
# Cambios vs v1:
#   + volumeMounts para certificados TLS (/etc/tls)
#   + anotaciones prometheus.io/scrape para métricas PHP-FPM
#   + WS_NOTIFY_KEY env var para WebSocketObserver
# ============================================================

# ════════ Instancia A (Principal) ════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-a
  namespace: electrisys
  labels:
    app: backend
    instance: "a"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      instance: "a"
  template:
    metadata:
      labels:
        app: backend
        instance: "a"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9253"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        - name: php-fpm
          image: electrisys/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000   # PHP-FPM local
            - containerPort: 9443   # stunnel mTLS listener
            - containerPort: 9253   # php-fpm exporter (Prometheus)
          envFrom:
            - secretRef:
                name: electrisys-secrets
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: CORS_ORIGIN
              value: "http://localhost"
            # Sin esto, GestorAsistente.php no sabe a dónde llamar y
            # /api/asistente/consultar falla aunque nlp-service esté corriendo.
            - name: NLP_SERVICE_URL
              value: "http://nlp-service:8000"
            - name: NLP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: electrisys-secrets
                  key: NLP_INTERNAL_KEY
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
        # Sidecar que publica las métricas de PHP-FPM en :9253, el puerto
        # que ya declaraban las anotaciones prometheus.io de este pod pero
        # donde no escuchaba ningún proceso. Lee la página de estado por
        # FastCGI en localhost (ver docker/php-fpm-status.conf).
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter:2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9253
          env:
            - name: PHP_FPM_SCRAPE_URI
              value: "tcp://127.0.0.1:9000/status"
            - name: PHP_FPM_WEB_LISTEN_ADDRESS
              value: ":9253"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
      volumes:
        - name: tls-certs
          secret:
            secretName: electrisys-tls
---
# ════════ Instancia B (Failover / Canary) ════════════════════
