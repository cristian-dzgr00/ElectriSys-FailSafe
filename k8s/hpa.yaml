# ============================================================
# HorizontalPodAutoscaler — ElectriSys Backend
# Escala automáticamente según CPU y memoria.
#
# scaleTargetRef apuntaba a un Deployment "electrisys-backend" que no
# existe: los Deployments reales son "backend-a" y "backend-b"
# (backend-deployment.yaml). Con un target inexistente el HPA queda en
# estado <unknown> y nunca escala.
#
# Se escala backend-a, la instancia principal. backend-b queda fijo en 1
# réplica porque es el failover/canary al que nginx solo manda tráfico
# como backup (ver upstream php_backend en nginx.conf).
#
# minReplicas: 2 pisa el "replicas: 1" del Deployment — eso es esperado:
# cuando hay un HPA, el número de réplicas lo gobierna el HPA.
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: electrisys-backend-hpa
  namespace: electrisys
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-a
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
